<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>♡왕전초 연산왕!♡</title>
<meta name="theme-color" content="#dcecff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연산왕">
<meta name="description" content="연산 기호를 넣어 식을 완성하는 초등 연산 퍼즐 게임">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238ed6ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233b62ff%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22272%22%20r%3D%22150%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.16%22%2F%3E%3Ctext%20x%3D%22256%22%20y%3D%22368%22%20font-family%3D%22system-ui%2C-apple-system%2C%27Apple%20SD%20Gothic%20Neo%27%2Csans-serif%22%20font-size%3D%22290%22%20font-weight%3D%22800%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E%3F%3C%2Ftext%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22150%22%20r%3D%2215%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.9%22%2F%3E%3Ccircle%20cx%3D%22368%22%20cy%3D%22132%22%20r%3D%2210%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.75%22%2F%3E%3Ccircle%20cx%3D%22384%22%20cy%3D%22392%22%20r%3D%2213%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.8%22%2F%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238ed6ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233b62ff%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22272%22%20r%3D%22150%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.16%22%2F%3E%3Ctext%20x%3D%22256%22%20y%3D%22368%22%20font-family%3D%22system-ui%2C-apple-system%2C%27Apple%20SD%20Gothic%20Neo%27%2Csans-serif%22%20font-size%3D%22290%22%20font-weight%3D%22800%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3E%3F%3C%2Ftext%3E%3Ccircle%20cx%3D%22150%22%20cy%3D%22150%22%20r%3D%2215%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.9%22%2F%3E%3Ccircle%20cx%3D%22368%22%20cy%3D%22132%22%20r%3D%2210%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.75%22%2F%3E%3Ccircle%20cx%3D%22384%22%20cy%3D%22392%22%20r%3D%2213%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.8%22%2F%3E%3C%2Fsvg%3E">
<link id="manifestLink" rel="manifest">
<style>
:root{
  --ink:#22315a; --ink-soft:#6b7ea6; --blue:#2f5cf0; --card-1:#3f74ff; --card-2:#2848cf;
  --line:#dbe6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 460px at 50% -8%, #ffffff 0%, rgba(255,255,255,0) 62%),
    linear-gradient(180deg,#e9f3ff 0%, #f5faff 44%, #edf5ff 100%);
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
  touch-action:manipulation;
}
body::before{
  content:"";position:fixed;left:-12%;top:16%;width:64vw;height:64vw;max-width:420px;max-height:420px;
  background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0));
  pointer-events:none;z-index:0;
}
button{font-family:inherit;cursor:pointer}
.app{
  position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
}
.topbar{display:flex;align-items:center;justify-content:center;padding:4px 0 4px}
.topbar h1{
  margin:0;flex:1 1 auto;min-width:0;text-align:center;
  font-size:clamp(20px,6.4vw,26px);font-weight:900;line-height:1.2;
  letter-spacing:-.045em;white-space:nowrap;color:#1f46c4;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.7),0 6px 14px rgba(47,92,240,.22);
}
.topbar h1 .hh{
  color:#ff5f95;font-weight:900;font-size:.94em;vertical-align:.02em;padding:0 .04em;
  text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.7),0 6px 14px rgba(255,95,149,.28);
}
.toptools{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 1px 5px}
.toptools .iconbtn{width:30px;height:30px;border-radius:10px}
.toptools .iconbtn svg{width:16px;height:16px}
.iconbtn{
  width:38px;height:38px;flex:0 0 auto;border-radius:13px;border:none;background:#fff;
  box-shadow:0 4px 12px rgba(58,96,180,.14);color:#3a6bd6;display:grid;place-items:center;padding:0;
  transition:transform .1s;
}
.iconbtn:active{transform:scale(.93)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .solid{fill:currentColor;stroke:none}
.iconbtn.off{color:#9aa9c6}

.playview{display:flex;flex-direction:column;width:100%}
@media (min-height:900px){
  main{flex:1;display:flex;flex-direction:column;justify-content:center}
  .playview,.resultview{width:100%}
  .equation{min-height:150px}
  .card{padding:26px 18px 22px}
  .statusbar{padding:16px 6px}
  .opbtn{height:64px;font-size:30px}
  .submit{height:66px}
  .mascot{width:124px;height:113px}
  .mascot.bear{width:116px;height:109px}
}
.mascots{
  display:flex;justify-content:center;align-items:flex-end;gap:2px;
  margin:0 0 -26px;position:relative;z-index:0;pointer-events:none;
}
.mascot{width:114px;height:104px;filter:drop-shadow(0 8px 12px rgba(60,90,160,.18))}
.mascot.bear{width:106px;height:100px;margin-bottom:4px}
.bob{animation:bob 3.4s ease-in-out infinite}
.bob2{animation:bob 3.9s ease-in-out .35s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mascots[data-mood="happy"] .mascot{animation:hop .55s ease}
.mascots[data-mood="sad"] .mascot{animation:tremble .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-13px) rotate(-3deg)}70%{transform:translateY(-4px)}}
@keyframes tremble{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}60%{transform:translateX(4px)}}

.face{display:none}
.mascots[data-mood="idle"] .face-idle,
.mascots[data-mood="happy"] .face-happy,
.mascots[data-mood="sad"] .face-sad{display:block}

.statusbar{
  position:relative;z-index:1;background:#fff;border-radius:999px;
  box-shadow:0 10px 24px rgba(56,92,170,.16);display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:13px 6px;margin-bottom:11px;
}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:#eef3fd}
.statlabel{font-size:10.5px;color:#93a3c2;font-weight:800;letter-spacing:.02em}
.stat b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.dots{display:flex;gap:7px;justify-content:center;margin:0 0 11px;height:9px}
.dot{width:9px;height:9px;border-radius:50%;background:#cfdcf4;transition:all .2s}
.dot.now{background:var(--blue);width:24px;border-radius:999px}
.dot.ok{background:#2bc48a}
.dot.no{background:#ffb4c0}

.card{
  position:relative;background:linear-gradient(165deg,var(--card-1) 0%,#2a55e6 58%,var(--card-2) 100%);
  border-radius:30px;padding:22px 16px 18px;color:#fff;overflow:hidden;
  box-shadow:0 20px 36px -12px rgba(38,70,200,.55), inset 0 2px 0 rgba(255,255,255,.22);
  transition:transform .12s;
}
.card::after{
  content:"";position:absolute;left:-30%;right:-30%;bottom:-58%;height:70%;
  background:radial-gradient(closest-side,rgba(255,255,255,.18),rgba(255,255,255,0));
  pointer-events:none;
}
.card.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
.card.pop{animation:pop .4s ease}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}

.refresh{
  position:absolute;top:11px;right:11px;width:38px;height:38px;border-radius:50%;border:none;
  background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;z-index:3;
  transition:transform .25s, background .2s;
}
.refresh:active{transform:rotate(-60deg);background:rgba(255,255,255,.3)}
.refresh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.equation{position:relative;z-index:2;padding:22px 4px 2px;min-height:108px;display:flex;flex-direction:column;justify-content:center}
.expr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 6px;font-weight:900;font-size:clamp(26px,8.2vw,36px);line-height:1;letter-spacing:-.02em}
.expr.dense{font-size:clamp(21px,6.9vw,31px);gap:5px 4px}
.eqnum{text-shadow:0 2px 0 rgba(10,30,110,.16)}
.eqtotal{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-weight:900;font-size:clamp(22px,6.8vw,30px);opacity:.96}
.slot{
  width:clamp(38px,11vw,48px);height:clamp(44px,12.4vw,54px);border-radius:15px;
  border:2.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.13);color:#fff;
  font-size:clamp(20px,6vw,26px);font-weight:900;display:grid;place-items:center;padding:0;
  transition:transform .12s, background .15s, color .15s;
}
.expr.dense .slot{width:clamp(34px,9.6vw,42px);height:clamp(40px,11vw,50px);border-radius:13px;font-size:clamp(18px,5.4vw,23px)}
.slot.filled{background:#fff;color:#2a55e6;border-color:#fff;box-shadow:0 3px 0 rgba(16,40,140,.25)}
.slot.active{background:rgba(255,255,255,.34);box-shadow:0 0 0 4px rgba(255,255,255,.24)}
.slot.active.filled{background:#fff;color:#2a55e6}
.slot.pulse{animation:sPulse 1.5s ease-in-out infinite}
.slot.pulse.filled{animation:none}
@keyframes sPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.22)}50%{box-shadow:0 0 0 8px rgba(255,255,255,.1)}}
.slot:active{transform:scale(.94)}

.feedback{position:relative;z-index:2;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13.5px;font-weight:800;line-height:1.4;padding:6px 6px 2px;opacity:0;transition:opacity .18s}
.feedback.show{opacity:1}
.feedback.ok{color:#dffff0}
.feedback.bad{color:#ffe6ea}

.ops{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.opbtn{
  height:56px;border-radius:18px;border:none;background:#fff;color:#2a55e6;
  font-size:26px;font-weight:900;line-height:1;padding-bottom:2px;
  box-shadow:0 6px 0 rgba(18,44,140,.3);transition:transform .07s, box-shadow .07s;
}
.opbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(18,44,140,.3)}
.opbtn small{display:block;font-size:9px;font-weight:800;color:#94a6cc;margin-top:1px;letter-spacing:.02em}
.opbtn[hidden]{display:none}

.submit{
  margin:14px 0 0;width:100%;height:60px;border-radius:20px;border:none;color:#fff;
  font-size:19px;font-weight:900;letter-spacing:.01em;
  background:linear-gradient(160deg,#8ed6ff 0%,#5a8bff 46%,#6a5cff 100%);
  box-shadow:0 8px 0 #2b46c7, 0 18px 28px -10px rgba(48,78,200,.6);
  transition:transform .08s, box-shadow .08s;
}
.submit:active{transform:translateY(5px);box-shadow:0 3px 0 #2b46c7}
.submit.retry{background:linear-gradient(160deg,#ffd98a,#ffb84d 60%,#ff9f2e);box-shadow:0 8px 0 #c9761c,0 18px 28px -10px rgba(200,130,40,.5);color:#4a2a00}

.skip{display:block;margin:11px auto 0;background:none;border:none;color:#7b8ead;font-size:13.5px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}

.resultview{padding-top:2px}
.resultcard{background:#fff;border-radius:30px;padding:20px 18px 20px;box-shadow:0 20px 44px -16px rgba(56,92,170,.4);text-align:center}
.resultmascots{display:flex;justify-content:center;margin-top:-6px;margin-bottom:2px}
.resultmascots .mascot{width:96px;height:90px}
.resultcard h2{margin:2px 0 0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.resultcard .sub{margin:4px 0 0;font-size:12.5px;color:#93a3c2;font-weight:700}
.stars{font-size:31px;letter-spacing:5px;margin:8px 0 6px;color:#ffcf47;line-height:1}
.stars i{font-style:normal;display:inline-block;text-shadow:0 2px 0 rgba(230,170,20,.25)}
.stars i.off{color:#e4eaf6;text-shadow:none}
.stars i.on{animation:starPop .5s ease backwards}
.stars i.on:nth-child(2){animation-delay:.1s}
.stars i.on:nth-child(3){animation-delay:.2s}
@keyframes starPop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1) rotate(0);opacity:1}}

.resultStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.resultStats div{background:#f2f7ff;border-radius:16px;padding:10px 4px}
.resultStats span{display:block;font-size:11px;color:#8ba0c2;font-weight:800;margin-bottom:3px}
.resultStats b{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.bestline{margin:6px 0 0;font-size:12.5px;color:#7d90b3;font-weight:800;min-height:18px}
.bestline .new{display:inline-block;margin-left:6px;background:#fff0d6;color:#c9761c;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900}
.resultButtons{display:grid;gap:9px;margin-top:14px}
.btn{border:none;border-radius:18px;height:52px;font-size:16px;font-weight:900;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#eef4ff;color:#3a63c9}
.btn.solid{background:linear-gradient(160deg,#5a8bff,#3b62ff);color:#fff;box-shadow:0 6px 0 #2b46c7}
.btn.solid:active{box-shadow:0 3px 0 #2b46c7;transform:translateY(3px)}
.btn.share{background:#fff;color:#3a63c9;border:2px solid #dbe6ff}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btnrow.solo{grid-template-columns:1fr}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(198,215,242,.8);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(60,90,150,.08);
}
.tabs{display:flex;gap:3px;width:100%;max-width:480px;margin:0 auto}
.tab{flex:1 1 0;min-width:0;border:none;background:none;border-radius:15px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#8a9ab8;font-weight:800;position:relative}
.tab .tn{font-size:16px;font-weight:900;line-height:1.1}
.tab .tl{font-size:9.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .mark{position:absolute;top:1px;right:calc(50% - 23px);font-size:10px;line-height:1;color:#ffb72b}
.tab.active{background:linear-gradient(180deg,#eaf2ff,#dae8ff);color:#2a55e6}
.tab.active .tl{color:#4f6ea8}

.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.spark{position:absolute;width:9px;height:9px;animation:fall 1.3s ease-out forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),70vh) rotate(520deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(34,49,90,.94);color:#fff;padding:11px 18px;border-radius:999px;
  font-size:13px;font-weight:800;z-index:50;max-width:88vw;text-align:center;
  box-shadow:0 10px 24px rgba(20,40,90,.28);animation:toastIn .18s ease;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.pausemask{position:fixed;inset:0;z-index:40;background:rgba(28,46,90,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:26px}
.pausecard{background:#fff;border-radius:26px;padding:24px 28px;text-align:center;box-shadow:0 24px 50px rgba(20,40,90,.3);width:100%;max-width:300px}
.pausecard p{margin:0 0 4px;font-size:19px;font-weight:900}
.pausecard span{display:block;font-size:12.5px;color:#94a4c2;font-weight:700;margin-bottom:16px}
.pausecard .btn{width:100%}

@media (max-width:360px){
  .app{padding-left:13px;padding-right:13px}
  .tab .tl{font-size:9px}
  .statusbar{padding:11px 4px}
  .stat b{font-size:16px}
}
@media (max-width:344px){
  .topbar h1{font-size:19px}
  .topbar h1 .hh{font-size:.92em}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1><span class="hh">♡</span>왕전초 연산왕!<span class="hh">♡</span></h1>
  </header>
  <div class="toptools">
    <button class="iconbtn" id="sndBtn" type="button" aria-label="효과음 켜기/끄기">
      <svg id="sndOnIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M15.6 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M18.2 6a8 8 0 0 1 0 12"/></svg>
      <svg id="sndOffIcon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button class="iconbtn" id="pauseBtn" type="button" aria-label="일시정지">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5v13M15 5.5v13"/></svg>
    </button>
  </div>

  <main>
    <section class="playview" id="playView">
      <div class="mascots" id="mascots" data-mood="idle" aria-hidden="true">
        <svg class="mascot purple bob" viewBox="0 0 128 118">
          <defs>

  function copyLink(url) {
    function done(ok) {
      toast(ok ? '링크를 복사했어요! 친구에게 붙여넣기 해 주세요.' : '주소창의 주소를 복사해 주세요: ' + url);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function shareGame() {
    var url = location.href.split('#')[0];
    var payload = { title: '♡왕전초 연산왕!♡', text: '연산 기호를 넣어 식을 완성하는 연산 게임! 같이 해 봐요.', url: url };
    if (navigator.share) {
      try {
        navigator.share(payload)['catch'](function () { copyLink(url); });
        return;
      } catch (e) {}
    }
    copyLink(url);
  }

  /* ---------- pause ---------- */
  function setPaused(on) {
    if (S.phase !== 'play') { return; }
    S.paused = !!on;
    $('pauseMask').hidden = !S.paused;
    if (!S.paused) { S.lastTick = Date.now(); }
  }

  /* ---------- manifest ---------- */
  function setupManifest() {
    var link = $('manifestLink');
    var icon = document.querySelector('link[rel="apple-touch-icon"]');
    var href = icon ? icon.getAttribute('href') : '';
    var mf = {
      name: '♡왕전초 연산왕!♡', short_name: '연산왕',
      description: '연산 기호를 넣어 식을 완성하는 초등 연산 퍼즐 게임',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'portrait',
      background_color: '#eaf4ff', theme_color: '#2f5cf0',
      icons: [{ src: href, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    try {
      link.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf)));
    } catch (e) {}
  }

  function applyMute() {
    $('sndOnIcon').style.display = save.muted ? 'none' : '';
    $('sndOffIcon').style.display = save.muted ? '' : 'none';
    $('sndBtn').className = 'iconbtn' + (save.muted ? ' off' : '');
    $('sndBtn').setAttribute('aria-label', save.muted ? '효과음 켜기' : '효과음 끄기');
  }

  /* ---------- events ---------- */
  function bind() {
    var ops = document.querySelectorAll('.opbtn'), i;
    for (i = 0; i < ops.length; i++) {
      ops[i].addEventListener('click', function () {
        placeOp(this.getAttribute('data-op'));
      });
    }
    $('equation').addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== this && !(t.getAttribute && t.getAttribute('data-slot') !== null && t.getAttribute('data-slot') !== '')) { t = t.parentNode; }
      if (!t || t === this) { return; }
      onSlot(parseInt(t.getAttribute('data-slot'), 10));
    });
    $('submitBtn').addEventListener('click', submit);
    $('skipBtn').addEventListener('click', skipProblem);
    $('refreshBtn').addEventListener('click', function () {
      if (S.phase !== 'play') { return; }
      sfx('tap');
      // replace current problem with a fresh one from the level's bag
      var levelId = S.level, pool = DATA.levels[levelId - 1].problems, p, guard = 0;
      if (!bags[levelId] || !bags[levelId].length) { bags[levelId] = shuffle(pool.slice()); }
      p = bags[levelId].pop();
      while (guard < 20 && p.join(',') === S.problems[S.idx].join(',')) { bags[levelId].unshift(p); p = bags[levelId].pop(); guard++; }
      S.problems[S.idx] = p;
      newProblem();
    });
    $('retryBtn').addEventListener('click', function () { sfx('tap'); startRound(S.level); });
    $('nextBtn').addEventListener('click', function () { sfx('tap'); startRound(Math.min(DATA.levels.length, S.level + 1)); });
    $('shareBtn').addEventListener('click', shareGame);
    $('sndBtn').addEventListener('click', function () {
      audioUnlocked = true;
      save.muted = !save.muted;
      writeStore();
      applyMute();
      if (!save.muted) { sfx('tap'); toast('효과음을 켰어요'); } else { toast('효과음을 껐어요'); }
    });
    $('pauseBtn').addEventListener('click', function () { setPaused(true); });
    $('resumeBtn').addEventListener('click', function () { setPaused(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === '+' || e.key === '=') { placeOp('+'); }
      else if (e.key === '-' || e.key === '−') { placeOp('-'); }
      else if (e.key === '*' || e.key === 'x' || e.key === 'X') { placeOp('×'); }
      else if (e.key === '/') { placeOp('÷'); }
      else if (e.key === 'Enter') { if (!$('resultView').hidden) { return; } submit(); }
    });
    document.addEventListener('pointerdown', function () { audioUnlocked = true; }, { once: true });
  }

  function init() {
    var stored = readStore();
    save.best = stored.best || {};
    save.muted = !!stored.muted;
    save.lastLevel = stored.lastLevel || 1;
    if (save.lastLevel < 1 || save.lastLevel > DATA.levels.length) { save.lastLevel = 1; }
    applyMute();
    buildTabs();
    bind();
    setupManifest();
    startRound(save.lastLevel);
  }

  /* test hook */
  window.__wangjeon = {
    evalOps: evalOps, evalDetail: evalDetail, solveAll: solveAll, countSolutions: countSolutions,
    solutionFor: solutionFor, exprString: exprString, DATA: DATA, state: S,
    levelOps: levelOps, renderOpButtons: renderOpButtons,
    startRound: startRound, submit: submit, placeOp: placeOp, onSlot: onSlot, finish: finish
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
